[project]
name = "policyassist-api"
version = "1.0.0"
description = "Local BM25 policy assistant API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "api:app"

[tool.vercel.fastapi.static]
cdn = false
